<h1>Else if condition</h1>
<br>

<button class="btn" (click)="handleColor(1)">Red</button>
<button class="btn" (click)="handleColor(2)">Green</button>
<button class="btn" (click)="handleColor(3)">Blue</button>
<button class="btn" (click)="handleColor(12)">Other</button>
<input type="text" (input)="handleInput($event)" placeholder="enter number">


@if(color == 1){
  <div style="background-color: red; width: 150px; height: 150px;"></div>
}
@else if(color == 2){
  <div style="background-color: green; width: 150px; height: 150px;"></div>
}

@else if(color == 3){
  <div style="background-color: blue; width: 150px; height: 150px;"></div>
}
@else{
  <div style="background-color: black; width: 150px; height: 150px;"></div>
}
