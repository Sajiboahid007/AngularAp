<h1>Switch Case</h1>

<button class="btn" (click)="handleColor('red')">Red</button>
<button class="btn" (click)="handleColor('green')">Green</button>
<button class="btn" (click)="handleColor('blue')">Blue</button>
<button class="btn" (click)="handleColor('black')">Black</button>

@switch(color){
  @case('red'){
    <h1 style="background-color: red;">Red color</h1>
  }
  @case('green'){
    <h1 style="background-color: green;">Green color</h1>
  }
  @case('blue'){
    <h1 style="background-color: blue;">Blue color</h1>
  }
  @default{
    <h1 style="background-color: black; color: white;">no color match</h1>
  }
}
