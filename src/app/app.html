<h1 style="color: rgb(147, 227, 161);">To Do List</h1>

<input type="text" [(ngModel)]="task" placeholder="enter to do list">

<button class="btn" (click)="taskList()">Add List</button>

@for(items of toDoList; track items.id){
  <ul style="display: flex;">
    <li>{{items.id}} </li>
    <li>{{items.doList}} </li>
    <li><button (click)="delete(items.id)">Delete</button></li>

  </ul>
}
