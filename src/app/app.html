<h1>Switch Case ngIf</h1>

<div [ngSwitch]="color" >
  <h2 *ngSwitchCase="'red'" style="background-color: red;">Red Color</h2>
  <h2 *ngSwitchCase="'green'" style="background-color: green;">Green Color</h2>
  <h2 *ngSwitchCase="'blue'" style="background-color: rgb(16, 16, 204);">Blue Color</h2>
  <h2 *ngSwitchCase="'yellow'" style="background-color: rgb(224, 193, 70);">Yellow Color</h2>
</div>

<button  (click)="changeColor()" [style.background]="nextColor"
 class="btn">Change Color</button>
